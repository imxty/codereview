version: "3"
services:
  etcd:
    image: bitnami/etcd:latest
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
    ports:
      - 2379:2379
      - 2380:2380
    networks:
      - app_net

  api:
    image: 703945416807.dkr.ecr.cn-north-1.amazonaws.com.cn/jm/jm-gateway:latest
    command:
      - "--config_etcd_address=etcd:2379"
      - "--server_address=0.0.0.0:16660"
      - "--server_name=com.shangyikangyou.huimaibao.api"
    depends_on:
      - etcd
    networks:
      - app_net
    ports:
      - "16660:16660"

  api-app:
    image: 703945416807.dkr.ecr.cn-north-1.amazonaws.com.cn/huimaibao/api-app:latest
    command:
      - "--registry=etcd"
      - "--registry_address=etcd:2379"
      - "--log_level=DEBUG"
      # 如果使用 Logstash 格式日志，取消下一行注释
      # - "--log_format=LOGSTASH"
      - "--register_interval=5"
      - "--register_ttl=10"
      - "--server_address=:6088"
      - "--client_pool_size=10"
      - "--config_etcd_address=etcd:2379"
      # - "--config_file=/conf/com.shangyikangyou.platform.srv.@global.docker-macos.yml"
      # - "--config_file=/conf/com.shangyikangyou.platform.srv.report.yml"
    volumes:
      - "./conf:/conf"
    depends_on:
      - etcd
    networks:
      - app_net
    ports:
      - "6088:6088"
  api-boss:
