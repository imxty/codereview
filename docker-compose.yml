    volumes:
      - ./redis_data:/var/lib/redis

networks:
  app_net:
    ipam:
      driver: default
      config:
        #
        # 合法的可以地址范围如下：
        #   A类地址：10.0.0.0～10.255.255.255
        #   B类地址：172.16.0.0～172.31.255.255
        #   C类地址：192.168.0.0～192.168.255.255
        #
        # 避免使用与部署环境 VPC 的 CIDR 相冲突的子网，以下几个禁止使用：
        #   - 172.31.0.0/16
        #   - 172.31.0.0/16
        #   - 10.0.0.0/16
        #   - 10.169.0.0/16
        #
        - subnet: "192.168.29.0/24"
